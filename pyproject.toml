[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-mindbench"
version = "0.2.0.dev0"
description = "Nonclinical EEG/behavior audit, group-safe synthetic benchmark, fusion and accessible QA explorer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Multimodal MindBench contributors"}]
dependencies = []

[project.optional-dependencies]
edf = ["mne>=1.6,<2"]
test = ["pytest>=8,<10", "pytest-cov>=5"]
benchmark = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[project.scripts]
mindbench = "mindbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
